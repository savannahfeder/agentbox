<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#f3f1ef;color:#1a1817;font:16px/24px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <div style="max-width:440px;margin:0 auto;padding:32px;background:#fff;border-radius:3px">
      <div style="font-size:17px;font-weight:600;margin-bottom:22px">Agentbox</div>
      <p style="margin:0 0 22px">Confirm this address to finish creating your Agentbox account.</p>
      <p style="margin:0 0 24px">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:11px 20px;border-radius:3px;background:#ee6018;color:#1a1817;text-decoration:none;font-weight:500">Confirm your email</a>
      </p>
      <p style="margin:0 0 8px;font-size:14px;line-height:21px;color:#6b6462">Open it on the computer you signed up on and Agentbox signs you in there. The link lasts an hour.</p>
      <p style="margin:0;font-size:14px;line-height:21px;color:#6b6462">If you did not create an Agentbox account, ignore this email.</p>
    </div>
  </body>
</html>
