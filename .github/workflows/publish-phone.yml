name: Publish phone app

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phone-publisher
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --maxWorkers=2 --minWorkers=1
      - run: npm run typecheck
      - name: Build the public phone site
        env:
          PHONE_SITE_CONFIG: ${{ vars.PHONE_SITE_CONFIG }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("cloud/team.config.json", process.env.PHONE_SITE_CONFIG)'
          npm run phone:build
      - uses: actions/upload-artifact@v7
        with:
          name: phone-site
          path: phone-site/
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: agentbox-phone-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: phone-site
          path: phone-site/
      - name: Publish this build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add CLOUDFLARE_API_TOKEN to the agentbox-phone-publisher environment'; exit 1; }
          test "$(gh api repos/$GH_REPO/commits/main --jq .sha)" = "$GITHUB_SHA"
          npx --yes wrangler@4.151.1 pages deploy phone-site --project-name agentbox-phone --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Verify the deployed commit
        run: |
          node --input-type=module -e 'const r = await fetch("https://app.agentbox.ac", {signal: AbortSignal.timeout(30000)}); if (!r.ok || !(await r.text()).includes(process.env.GITHUB_SHA)) throw new Error("The deployed phone site does not match this build")'
      - name: Verify dismissal in the deployed app
        env:
          CHROME: /usr/bin/google-chrome
        run: node scripts/verify-phone-dismissal.mjs https://app.agentbox.ac phone-verification
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-verification
          path: phone-verification/
          if-no-files-found: ignore
          retention-days: 7
