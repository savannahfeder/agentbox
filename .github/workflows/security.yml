# SECURITY CHECKS ON EVERY SHIP, AND EVERY DAY.
#
# Shipping is a push to main (`npm run ship`), so that push is the deploy moment
# this runs on. Pull requests run it too, so a fork's change is scanned before
# anyone merges it. The daily run catches what changes without a push: a new
# Semgrep rule, or a new advisory against a package the app already ships.
#
# semgrep: static rules for JavaScript, TypeScript and committed secrets, over
#   the code that ships (not tests). A finding fails the run. A false positive
#   someone has read is silenced with a `nosemgrep` comment on that line, never
#   by dropping the rule for everyone.
# audit: npm's advisory database over both lockfiles (root and mobile),
#   dev packages included, failing on high or critical. An advisory with no fix
#   yet is listed by id in scripts/audit-packages.mjs with why it reaches nobody.
#
# The agent-driven reviews are not here: they run on the person's own Claude
# Code plan as repeating tasks in the app. docs/security-checks.md is what they
# do, and it is where a red run of this workflow gets read.
#
# Same rules as tests.yml: a read-only token, no secrets, never pull_request_target.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.182.1
      - run: >-
          semgrep scan --error --metrics off
          --config p/javascript --config p/typescript --config p/secrets
          --exclude tests --exclude node_modules --exclude dist
          main shared mcp cloud bin scripts renderer/src mobile/src preload.cjs

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/audit-packages.mjs
