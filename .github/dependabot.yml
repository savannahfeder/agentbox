# Pins remain reproducible; upgrades arrive as reviewable PRs, never auto-merges.
# Active after this file reaches the GitHub default branch. Security updates
# additionally require Dependabot alerts/security updates enabled in the repo.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # The tiptap packages only work at matching versions, so they arrive as one
    # pull request rather than one per package (w-bde446f1aa).
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
